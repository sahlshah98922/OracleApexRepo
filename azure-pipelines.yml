
trigger:
  - master

pool:
  vmImage: windows-latest

variables:
  appId: '63210'
  workspace: 'TEST_APEX_1'
  schemaAlias: 'test_apex_1'
  exportFile: 'oracle-apex-devsecops/applications/app_63210/f63210.sql'

steps:
  - checkout: self
    displayName: Checkout GitHub Repository

  - powershell: |
      $file = "$(Build.SourcesDirectory)/$(exportFile)"

      Write-Host "Checking Oracle APEX export..."

      if (!(Test-Path $file)) {
          Write-Error "APEX export file not found: $file"
          exit 1
      }

      $size = (Get-Item $file).Length

      if ($size -eq 0) {
          Write-Error "APEX export file is empty"
          exit 1
      }

      Write-Host "Application ID: $(appId)"
      Write-Host "Workspace: $(workspace)"
      Write-Host "Export file: $file"
      Write-Host "File size: $size bytes"
      Write-Host "Validation successful."

    displayName: Validate APEX Export

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/oracle-apex-devsecops/applications/app_63210'
      ArtifactName: 'APEX-Application'
      publishLocation: Container
    displayName: Publish APEX Export Artifact
