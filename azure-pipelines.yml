
trigger:
  - master

pool:
  vmImage: windows-latest

variables:
- group: APEX-DESTINATION

- name: appId
  value: '63210'

- name: workspace
  value: 'TEST_APEX_1'

- name: schemaAlias
  value: 'test_apex_1'

- name: exportFile
  value: 'oracle-apex-devsecops/applications/app_63210/f63210.sql'

steps:
  - checkout: self
    displayName: Checkout GitHub Repository

  - powershell: |
      $file = "$(Build.SourcesDirectory)/$(exportFile)"

      Write-Host "Checking Oracle APEX export..."

      if (!(Test-Path $file)) {
          Write-Error "APEX export file not found: $file"
          exit 1
      }

      $size = (Get-Item $file).Length

      if ($size -eq 0) {
          Write-Error "APEX export file is empty"
          exit 1
      }

      Write-Host "Application ID: $(appId)"
      Write-Host "Workspace: $(workspace)"
      Write-Host "Export file: $file"
      Write-Host "File size: $size bytes"
      Write-Host "Validation successful."

    displayName: Validate APEX Export

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/oracle-apex-devsecops/applications/app_63210'
      ArtifactName: 'APEX-Application'
      publishLocation: Container
    displayName: Publish APEX Export Artifact



  - task: PowerShell@2
    displayName: 'Deploy Oracle APEX Application'
    inputs:
      targetType: 'inline'
      script: |
        $file = "$(Build.SourcesDirectory)/$(exportFile)"

        if (!(Test-Path $file)) {
          throw "APEX export file not found: $file"
        }

        $url = "$(APEX_HOME_URL)/$(schemaAlias)/_/db-api/stable/apex/workspaces/$(APEX_WORKSPACE)/applications/$(appId)"

        $pair = "$(APEX_USERNAME):$(APEX_PASSWORD)"
        $bytes = [System.Text.Encoding]::ASCII.GetBytes($pair)
        $token = [Convert]::ToBase64String($bytes)

        $headers = @{
          Authorization = "Basic $token"
        }

        Write-Host "Deploying Application ID: $(appId)"
        Write-Host "Destination Workspace: $(APEX_WORKSPACE)"

        try {
          $response = Invoke-WebRequest -Uri $url -Method PUT -Headers $headers -ContentType "application/sql" -InFile $file -UseBasicParsing

          Write-Host "HTTP Status: $($response.StatusCode)"
          Write-Host "Deployment completed."
        }
        
        catch {
            Write-Host "APEX Deployment Failed"

            $response = $_.Exception.Response

            if ($response -ne $null) {
                Write-Host "HTTP Status: $([int]$response.StatusCode)"
                Write-Host "Status Description: $($response.StatusDescription)"

                $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
                $body = $reader.ReadToEnd()
                $reader.Close()

                Write-Host "Oracle Response:"
                Write-Host $body
            }
            else {
                Write-Host $_.Exception.Message
            }

            throw
        }
  
