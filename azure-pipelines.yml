trigger:
  - master

pool:
  name: APEX-Windows-Pool

variables:
  - group: APEX-DESTINATION

stages:

# =========================
# CI STAGE
# =========================
- stage: CI
  displayName: APEX Continuous Integration

  jobs:
  - job: Build
    displayName: Validate and Publish APEX Export

    steps:
    - checkout: self
      displayName: Checkout GitHub Repository

    - powershell: |
        $folder = "$(Build.SourcesDirectory)/oracle-apex-devsecops/applications"

        $files = Get-ChildItem -Path $folder -Recurse -Filter "f*.sql" -File

        if (!$files) {
            throw "No APEX export files found."
        }

        foreach ($file in $files) {
            if ($file.Length -eq 0) {
                throw "Empty export file: $($file.FullName)"
            }

            Write-Host "Validated: $($file.Name)"
        }

        Write-Host "Total APEX exports: $($files.Count)"

      displayName: Validate APEX Exports

    - task: PublishBuildArtifacts@1
      displayName: Publish APEX Export Artifact
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/oracle-apex-devsecops/applications'
        ArtifactName: 'APEX-Application'
        publishLocation: Container


# =========================
# CD STAGE
# =========================
- stage: CD
  displayName: APEX Continuous Deployment
  dependsOn: CI

  jobs:
  - job: Deploy
    displayName: Import APEX Applications

    steps:

    - task: DownloadBuildArtifacts@0
      displayName: Download APEX Artifact
      inputs:
        buildType: current
        downloadType: single
        artifactName: APEX-Application
        downloadPath: '$(Pipeline.Workspace)'

    
    - powershell: |
        $url = "$(APEX_HOME_URL)".TrimEnd('/') + "/"

        Write-Host "Testing Oracle APEX server connectivity..."
        Write-Host "Target: $url"

        try {
            $response = Invoke-WebRequest `
                -Uri $url `
                -Method GET `
                -UseBasicParsing `
                -ErrorAction Stop

            Write-Host "HTTP Status: $([int]$response.StatusCode)"
            Write-Host "Server is reachable."
        }
        catch {
            Write-Host "Connectivity test result:"
            Write-Host $_.Exception.Message

            if ($_.Exception.Response) {
                Write-Host "HTTP Status: $([int]$_.Exception.Response.StatusCode)"
            }

            throw
        }
      displayName: Test Oracle APEX Connectivity

